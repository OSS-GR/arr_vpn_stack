version: '3.3'
services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: vpn_gluetun_nordvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - SERVER_REGIONS=The Americas
      - SERVER_CATEGORIES=P2P
      - TZ=America/New_York
      - DNS_UPDATE_PERIOD=12h
    ports:
      - 8080:8080       # qbittorrent — webui
      - 9696:9696       # prowlarr — webui
      - 58261:58261     # qbittorrent — torrenting (TCP)
      - 58261:58261/udp # qbittorrent — torrenting (UDP)
      - 8191:8191       # flaresolverr — proxy
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/v1/vpn/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent1
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=America/New_York
      - WEBUI_PORT=8080
      - TORRENTING_PORT=58261
    volumes:
      - /portainer/Files/AppData/Config/qBittorrent:/config
      - /mnt/manshare:/data
    network_mode: "container:vpn_gluetun_nordvpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: Prowlarr
    environment:
      - PUID=1000
      - PGID=100
      - HOME=/root
      - TERM=xterm
      - S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0
      - XDG_CONFIG_HOME=/config/xdg
    volumes:
      - /portainer/Files/AppData/Config/Prowlarr:/config
    network_mode: "container:vpn_gluetun_nordvpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Etc/UTC
    network_mode: "container:vpn_gluetun_nordvpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped